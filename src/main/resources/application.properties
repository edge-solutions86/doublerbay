# The database, the book, the catalogue and the keys are handed to the service when it starts.
# What is here is only how Spring itself should behave.
spring.application.name=doublerbay
spring.main.banner-mode=off
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.api-docs.version=openapi_3_1
springdoc.default-produces-media-type=application/json
# Said out loud, because springdoc warns at every start that both are on when it is left to assume so.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
