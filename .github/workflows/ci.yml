name: CI

# Every gate here is one named in tooling/Gates.java, and a test asserts this
# file names all of them. Adding a gate there without adding it here fails that
# test, which is what keeps the two honest.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite pins the day it answers as of, but anything that reaches for a
  # real clock should read the same one on a runner as on a laptop.
  TZ: UTC

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Compiles, checks the format, runs the suite with its coverage gate, and
      # writes the runnable jar the surface steps below use.
      - name: build
        run: ./gradlew build

      # The rules the whole repository is written to: every warning is an error.
      - name: lint
        run: ./gradlew compileJava compileTestJava

      # A formatting argument in a review is an argument nobody needs.
      - name: format
        run: ./gradlew spotlessCheck

      # A measurement passed as the wrong unit is a type error here.
      - name: types
        run: ./gradlew compileJava

      # The suite, which is the only thing that says the rules are right.
      - name: tests
        run: ./gradlew test

      # A migration that does not apply to an empty database, or that cannot
      # be undone, is found at deploy time otherwise. Both directions run.
      - name: migrations
        run: ./gradlew test --tests *MigrationsTest

      - name: rollback
        run: ./gradlew test --tests *MigrationsTest.theSchemaComesApartAgain

      # The command exits non zero if anything that writes is unguarded, so
      # this fails on a route added without a key check rather than shipping.
      - name: routes
        run: java -jar build/libs/doublerbay-0.1.0.jar routes

      - name: contract
        run: java -jar build/libs/doublerbay-0.1.0.jar contract --to openapi.json

      - name: upload the contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
